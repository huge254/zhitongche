# 后端：Deployment + Service + HPA（本项目核心亮点之一）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zhitongche
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ztc-backend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PASSWORD
              value: root123456
            - name: DB_NAME
              value: zhitongche
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zhitongche
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
---
# HPA：按 CPU 利用率弹性伸缩 1~3 副本（需要 metrics-server，k3s 自带）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: zhitongche
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
