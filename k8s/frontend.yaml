# 前端：Nginx 静态托管 + 反代 /api/ 到后端（同源部署，无需 Ingress 跨域）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zhitongche
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ztc-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zhitongche
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
---
# 入口：NodePort 30080（练习环境最简）
# 若要用 Ingress 多域名方案，另见 ingress.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: zhitongche
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
