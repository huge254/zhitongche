<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 - 职通车</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link active" id="tab-company" href="#" onclick="switchTab('company'); return false;">企业审核</a></li>
    <li class="nav-item"><a class="nav-link" id="tab-app" href="#" onclick="switchTab('app'); return false;">投递管理</a></li>
  </ul>

  <div class="card p-3">
    <table class="table table-hover align-middle" id="company-table">
      <thead></thead><tbody></tbody>
    </table>
    <table class="table table-hover align-middle" id="app-table" style="display:none;">
      <thead></thead><tbody></tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav();

function switchTab(name) {
  document.getElementById('company-table').style.display = name === 'company' ? '' : 'none';
  document.getElementById('app-table').style.display = name === 'app' ? '' : 'none';
  document.getElementById('tab-company').classList.toggle('active', name === 'company');
  document.getElementById('tab-app').classList.toggle('active', name === 'app');
}

async function loadCompanies() {
  const res = await api('/api/admin/company/list');
  renderTable('#company-table', res.data,
    [
      { key: 'companyId', title: 'ID' },
      { key: 'name', title: '企业名称' },
      { key: 'contact', title: '联系人' },
      { key: 'createdAt', title: '申请时间' }
    ],
    item => `<td>${companyStatusBadge(item.status)} ` +
      (item.status === 0
        ? `<button class="btn btn-sm btn-success ms-2 rounded-pill px-3" onclick="audit(${item.companyId}, true)">通过</button>
           <button class="btn btn-sm btn-outline-danger ms-1 rounded-pill px-3" onclick="audit(${item.companyId}, false)">拒绝</button>`
        : '') + `</td>`);
}

async function audit(cid, pass) {
  await api('/api/admin/company/audit', { method: 'POST', body: JSON.stringify({ companyId: cid, pass }) });
  showToast(pass ? '已通过审核' : '已拒绝', 'success');
  loadCompanies();
}

async function loadApplications() {
  const res = await api('/api/admin/application/list');
  renderTable('#app-table', res.data,
    [
      { key: 'applicationId', title: 'ID' },
      { key: 'studentName', title: '学生' },
      { key: 'jobTitle', title: '职位' },
      { key: 'company', title: '企业' },
      { key: 'applyTime', title: '投递时间' }
    ],
    item => `<td>${appStatusBadge(item.status)}
      <select class="form-select form-select-sm d-inline-block ms-2" style="width:auto;" id="sel-${item.applicationId}">
        <option value="0">投递</option><option value="1">初筛</option><option value="2">面试</option>
        <option value="3">录用</option><option value="4">淘汰</option>
      </select>
      <button class="btn btn-sm btn-outline-primary ms-1" onclick="updateStatus(${item.applicationId})">更新</button></td>`);
}

async function updateStatus(aid) {
  const status = Number(document.getElementById('sel-' + aid).value);
  await api('/api/admin/application/status', { method: 'POST', body: JSON.stringify({ applicationId: aid, status }) });
  showToast('状态已更新', 'success');
  loadApplications();
}

loadCompanies();
loadApplications();
</script>
</body>
</html>
