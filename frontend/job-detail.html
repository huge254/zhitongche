<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职位详情 - 职通车</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4" style="max-width: 900px;">
  <div class="mb-3"><a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill">← 返回职位列表</a></div>

  <div class="card p-4">
    <h3 id="job-title" class="fw-bold">加载中…</h3>
    <div class="fs-4 job-salary my-2" id="job-salary"></div>
    <div class="text-muted mb-3" id="job-meta"></div>
    <hr>
    <div class="mb-2 fw-bold">职位描述</div>
    <div id="job-desc" style="white-space: pre-line; min-height: 80px;" class="mb-4"></div>
    <div class="mb-2 fw-bold">任职要求</div>
    <div id="job-req" style="white-space: pre-line; min-height: 80px;" class="mb-4"></div>
    <hr>
    <button class="btn btn-primary btn-lg w-100" id="apply-btn" onclick="apply()">投递简历</button>
    <div class="text-muted small text-center mt-2" id="apply-tip"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav();
const id = getQuery('id');
if (!id) { showToast('缺少职位 id', 'error'); location.href = 'index.html'; }

async function load() {
  const res = await api('/api/job/' + id);
  const j = res.data;
  document.getElementById('job-title').textContent = j.title;
  document.getElementById('job-salary').textContent = salaryText(j.salaryMin, j.salaryMax);
  document.getElementById('job-meta').textContent = `${j.company || '-'} · ${j.city || '-'} · 发布于 ${(j.createdAt || '').slice(0, 10)}`;
  document.getElementById('job-desc').textContent = j.description || '（无描述）';
  document.getElementById('job-req').textContent = j.requirement || '（无要求）';
}

async function apply() {
  let rid = localStorage.getItem('resumeId');
  if (!rid) {
    showToast('请先完善简历', 'info');
    location.href = 'resume.html';
    return;
  }
  await api('/api/application/submit', {
    method: 'POST',
    body: JSON.stringify({ jobId: Number(id), resumeId: Number(rid) })
  });
  const btn = document.getElementById('apply-btn');
  btn.disabled = true;
  btn.textContent = '已投递';
  document.getElementById('apply-tip').textContent = '可到管理后台查看投递进度';
  showToast('投递成功！', 'success');
}

load();
</script>
</body>
</html>
