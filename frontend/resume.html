<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历编辑 - 职通车</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4" style="max-width: 720px;">
  <div class="card p-4">
    <h4 class="fw-bold mb-1">📄 我的简历</h4>
    <p class="text-muted small mb-4">完善简历后即可投递心仪职位</p>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">姓名 <span class="text-danger">*</span></label>
        <input id="name" class="form-control" placeholder="请输入姓名">
      </div>
      <div class="col-md-6">
        <label class="form-label">学校</label>
        <input id="school" class="form-control" placeholder="毕业院校">
      </div>
      <div class="col-md-6">
        <label class="form-label">专业</label>
        <input id="major" class="form-control" placeholder="所学专业">
      </div>
      <div class="col-md-6">
        <label class="form-label">技能标签（逗号分隔）</label>
        <input id="skills" class="form-control" placeholder="如：Linux, Docker, K8s">
      </div>
      <div class="col-12">
        <label class="form-label">自我介绍</label>
        <textarea id="intro" class="form-control" rows="5" placeholder="简单介绍自己的项目经历与优势"></textarea>
      </div>
    </div>

    <button class="btn btn-primary btn-lg w-100 mt-4" onclick="save()">保存简历</button>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav();

async function load() {
  const rid = localStorage.getItem('resumeId');
  if (!rid) return;
  try {
    const res = await api('/api/resume/mine?resumeId=' + rid);
    const r = res.data;
    document.getElementById('name').value = r.studentName || '';
    document.getElementById('school').value = r.school || '';
    document.getElementById('major').value = r.major || '';
    document.getElementById('skills').value = r.skills || '';
    document.getElementById('intro').value = r.selfIntro || '';
  } catch (e) { /* 首次无简历，忽略 */ }
}

async function save() {
  const body = {
    studentName: document.getElementById('name').value.trim(),
    school: document.getElementById('school').value.trim(),
    major: document.getElementById('major').value.trim(),
    skills: document.getElementById('skills').value.trim(),
    selfIntro: document.getElementById('intro').value.trim(),
  };
  if (!body.studentName) return showToast('请填写姓名', 'info');
  const rid = localStorage.getItem('resumeId');
  if (rid) body.resumeId = Number(rid);
  const res = await api('/api/resume/save', { method: 'POST', body: JSON.stringify(body) });
  localStorage.setItem('resumeId', res.data.resumeId);
  showToast('简历保存成功', 'success');
}

load();
</script>
</body>
</html>
