<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业端 - 职通车</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4" style="max-width: 860px;">
  <!-- 企业注册/信息 -->
  <div class="card p-4 mb-4">
    <h5 class="fw-bold mb-3">🏢 企业信息</h5>
    <div id="reg-form">
      <div class="row g-2">
        <div class="col-md-6"><input id="reg-name" class="form-control" placeholder="企业名称"></div>
        <div class="col-md-4"><input id="reg-contact" class="form-control" placeholder="联系人/联系方式"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="register()">注册入驻</button></div>
      </div>
      <div class="text-muted small mt-2">注册后需管理员审核通过，才能发布职位</div>
    </div>
    <div id="company-info" style="display:none;">
      <div class="d-flex align-items-center gap-3">
        <div>
          <div class="fw-bold fs-5" id="c-name"></div>
          <div class="text-muted small" id="c-contact"></div>
        </div>
        <div id="c-status"></div>
      </div>
    </div>
  </div>

  <!-- 发布职位 -->
  <div class="card p-4">
    <h5 class="fw-bold mb-3">📢 发布职位</h5>
    <div id="publish-disabled" class="text-muted py-3" style="display:none;">企业审核通过后即可发布职位</div>
    <div id="publish-form">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">职位名称 <span class="text-danger">*</span></label>
          <input id="p-title" class="form-control" placeholder="如：运维工程师">
        </div>
        <div class="col-md-4">
          <label class="form-label">工作城市</label>
          <select id="p-city" class="form-select">
            <option>重庆</option><option>成都</option><option>北京</option>
            <option>上海</option><option>广州</option><option>深圳</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">薪资下限（元/月）</label>
          <input id="p-min" type="number" class="form-control" placeholder="如 8000">
        </div>
        <div class="col-md-6">
          <label class="form-label">薪资上限（元/月）</label>
          <input id="p-max" type="number" class="form-control" placeholder="如 15000">
        </div>
        <div class="col-12">
          <label class="form-label">职位描述</label>
          <textarea id="p-desc" class="form-control" rows="3" placeholder="岗位职责、工作内容…"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">任职要求</label>
          <textarea id="p-req" class="form-control" rows="3" placeholder="学历、经验、技能要求…"></textarea>
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-3" onclick="publish()">发布职位</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav();

async function loadCompany() {
  const cid = localStorage.getItem('companyId');
  if (!cid) {
    document.getElementById('publish-form').style.display = 'none';
    document.getElementById('publish-disabled').style.display = '';
    return;
  }
  try {
    const res = await api('/api/company/mine?companyId=' + cid);
    const c = res.data;
    document.getElementById('reg-form').style.display = 'none';
    document.getElementById('company-info').style.display = '';
    document.getElementById('c-name').textContent = c.name;
    document.getElementById('c-contact').textContent = c.contact || '-';
    document.getElementById('c-status').innerHTML = companyStatusBadge(c.status);
    if (c.status !== 1) {
      document.getElementById('publish-form').style.display = 'none';
      document.getElementById('publish-disabled').style.display = '';
    }
  } catch (e) {
    localStorage.removeItem('companyId');
  }
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const contact = document.getElementById('reg-contact').value.trim();
  if (!name) return showToast('请填写企业名称', 'info');
  const res = await api('/api/company/register', { method: 'POST', body: JSON.stringify({ name, contact }) });
  localStorage.setItem('companyId', res.data.companyId);
  showToast('注册成功，等待管理员审核', 'success');
  loadCompany();
}

async function publish() {
  const body = {
    companyId: Number(localStorage.getItem('companyId')),
    title: document.getElementById('p-title').value.trim(),
    city: document.getElementById('p-city').value,
    salaryMin: Number(document.getElementById('p-min').value || 0),
    salaryMax: Number(document.getElementById('p-max').value || 0),
    description: document.getElementById('p-desc').value.trim(),
    requirement: document.getElementById('p-req').value.trim(),
  };
  if (!body.title) return showToast('请填写职位名称', 'info');
  await api('/api/job/publish', { method: 'POST', body: JSON.stringify(body) });
  showToast('发布成功，已同步到搜索', 'success');
  ['p-title', 'p-desc', 'p-req', 'p-min', 'p-max'].forEach(i => document.getElementById(i).value = '');
}

loadCompany();
</script>
</body>
</html>
