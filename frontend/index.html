<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职位搜索 - 职通车</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <!-- 搜索横幅 -->
  <div class="yz-banner mb-4">
    <div class="row align-items-center">
      <div class="col-lg-6 mb-3 mb-lg-0">
        <h1 class="display-6 mb-2">好工作，职通车直达</h1>
        <p class="lead mb-0">全文检索 · 实时投递 · 流程可视</p>
      </div>
      <div class="col-lg-6">
        <div class="search-box">
          <input id="keyword" placeholder="🔍 搜索职位，如：运维 / 开发 / 测试…" onkeydown="if(event.key==='Enter') search()">
          <button onclick="search()">搜索</button>
        </div>
      </div>
    </div>
    <div class="yz-chip-row">
      <span class="yz-chip" onclick="quick('运维工程师')">🛠️ 运维</span>
      <span class="yz-chip" onclick="quick('开发工程师')">💻 开发</span>
      <span class="yz-chip" onclick="quick('测试')">🧪 测试</span>
      <span class="yz-chip" onclick="quick('')">🗂️ 全部职位</span>
      <span class="yz-chip" style="margin-left:auto;background:rgba(0,0,0,.15);cursor:pointer;" onclick="openFilter()">🎯 城市/薪资筛选</span>
    </div>
  </div>

  <!-- 筛选行 -->
  <div class="card p-3 mb-3" id="filter-bar" style="display:none;">
    <div class="row g-2 align-items-center">
      <div class="col-auto"><label class="form-label mb-0 small text-muted">城市</label></div>
      <div class="col-auto">
        <select id="f-city" class="form-select form-select-sm">
          <option value="">不限</option>
          <option>重庆</option><option>成都</option><option>北京</option>
          <option>上海</option><option>广州</option><option>深圳</option>
        </select>
      </div>
      <div class="col-auto"><label class="form-label mb-0 small text-muted">薪资</label></div>
      <div class="col-auto">
        <select id="f-salary" class="form-select form-select-sm">
          <option value="">不限</option>
          <option value="5000-10000">5-10k</option>
          <option value="10000-15000">10-15k</option>
          <option value="15000-20000">15-20k</option>
          <option value="20000-999999">20k+</option>
        </select>
      </div>
      <div class="col-auto"><button class="btn btn-primary btn-sm" onclick="search()">应用筛选</button></div>
      <div class="col-auto"><button class="btn btn-outline-secondary btn-sm" onclick="resetFilter()">重置</button></div>
    </div>
  </div>

  <!-- 热门职位 -->
  <div class="d-flex align-items-center mb-2">
    <h6 class="mb-0 me-2">🔥 热门职位</h6>
  </div>
  <div class="row g-2 mb-4" id="hot-row"></div>

  <!-- 搜索结果 -->
  <div class="d-flex align-items-center mb-2">
    <h6 class="mb-0 me-2">搜索结果</h6>
    <span class="badge text-bg-light" id="result-count"></span>
  </div>
  <div id="job-list"></div>
</div>

<script src="common.js"></script>
<script>
renderNav();
let currentKeyword = '';

function quick(kw) { currentKeyword = kw; document.getElementById('keyword').value = kw; search(); }
function openFilter() {
  const bar = document.getElementById('filter-bar');
  bar.style.display = bar.style.display === 'none' ? '' : 'none';
}
function resetFilter() {
  document.getElementById('f-city').value = '';
  document.getElementById('f-salary').value = '';
  search();
}

function skeletonRows(n) {
  let html = '';
  for (let i = 0; i < n; i++) html += '<div class="yz-skeleton mb-2"><div class="sk-line sk-shimmer" style="width:40%"></div><div class="sk-line sk-shimmer" style="width:70%"></div><div class="sk-line sk-shimmer" style="width:55%"></div></div>';
  return html;
}

async function loadHot() {
  const res = await api('/api/job/hot');
  const list = res.data || [];
  document.getElementById('hot-row').innerHTML = list.length
    ? list.map(j => `
      <div class="col-md-4 col-sm-6">
        <a href="job-detail.html?id=${j.jobId}" class="text-decoration-none">
          <div class="card card-hover p-3 h-100">
            <div class="job-title text-truncate">${j.title}</div>
            <div class="d-flex justify-content-between mt-1">
              <span class="job-salary">${salaryText(j.salaryMin, j.salaryMax)}</span>
              <span class="text-muted small">${j.applyCount || 0} 人投递</span>
            </div>
            <div class="text-muted small">${j.company || '-'} · ${j.city || '-'}</div>
          </div>
        </a>
      </div>`).join('')
    : '<div class="col-12 text-muted small">暂无热门职位</div>';
}

async function search() {
  const keyword = document.getElementById('keyword').value.trim();
  const city = document.getElementById('f-city').value;
  const salary = document.getElementById('f-salary').value;
  const box = document.getElementById('job-list');
  box.innerHTML = skeletonRows(3);

  const qs = new URLSearchParams();
  if (keyword) qs.set('keyword', keyword);
  if (city) qs.set('city', city);
  if (salary) {
    const [min, max] = salary.split('-');
    qs.set('salaryMin', min);
    qs.set('salaryMax', max);
  }
  const res = await api('/api/job/search?' + qs.toString());
  const list = res.data || [];
  document.getElementById('result-count').textContent = '共 ' + list.length + ' 个职位';
  box.innerHTML = list.length
    ? list.map(j => `
      <div class="card card-hover p-3 mb-2">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="job-title">${j.title}</div>
            <div class="text-muted small mt-1">${j.company || '-'} · ${j.city || '-'} · ${(j.createdAt || '').slice(0, 10)}</div>
          </div>
          <div class="text-end">
            <div class="job-salary">${salaryText(j.salaryMin, j.salaryMax)}</div>
            <a href="job-detail.html?id=${j.jobId}" class="btn btn-primary btn-sm mt-1">查看详情</a>
          </div>
        </div>
      </div>`).join('')
    : '<div class="yz-empty"><span class="emoji">🔍</span>没有找到匹配的职位，换个关键词试试</div>';
}

loadHot();
search();
</script>
</body>
</html>
